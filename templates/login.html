<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TRUFARM TRADE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #198754 0%, #0d5233 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { border-radius: 15px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
    </style>
</head>
<body>
    <div class="card login-card p-4 bg-white">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success">🌾 TRUFARM TRADE</h3>
            <p class="text-muted small">Enter Mobile No, Email ID, or Unique Reg ID</p>
        </div>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold">Login Identifier</label>
                <input type="text" name="user_id" class="form-control" placeholder="Mobile / Email / Reg ID" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password / Security PIN</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 fw-bold py-2 mb-3">Sign In / Register</button>
        </form>
    </div>
</body>
</html>
